name: SpeedDocument CI/CD

# Kích hoạt workflow khi push hoặc mở PR vào nhánh main / master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ================= CI: BACKEND =================
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Build / Test
        run: npm run build --if-present

  # ================= CI: ADMIN (REACT) =================
  admin-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./speeddocument-admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: speeddocument-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React Admin
        run: npm run build

  deploy:
    needs: [backend-ci, admin-ci] 
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /path/to/SpeedDocument
            git pull origin main
            docker compose down